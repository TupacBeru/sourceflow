[package]
name = "sourceflow"
version = "0.1.0"
description = "Lightweight GitHub-focused Git client for Fedora / KDE"
authors = ["SourceFlow contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "sourceflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = [] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.2"
tauri-plugin-shell = "2.0"

# Git engine
git2 = { version = "0.19", default-features = false, features = ["https", "vendored-libgit2", "vendored-openssl"] }

# Async runtime + http for OAuth
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS keyring (Secret Service on Linux - works with KWallet and GNOME Keyring)
keyring = { version = "3", features = ["linux-native"] }

# OAuth helpers
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2.5"

# Utilities
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[features]
# This feature is used for production builds or when a dev server is not specified.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
