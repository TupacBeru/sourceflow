[package]
name = "sourceflow"
version = "0.1.0"
description = "Lightweight GitHub-focused Git client for Fedora / KDE"
authors = ["SourceFlow contributors"]
edition = "2021"
license = "MIT"
rust-version = "1.77"

[lib]
name = "sourceflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["image-png"] }
tauri-plugin-dialog = "2.0"
tauri-plugin-opener = "2.2"
tauri-plugin-shell = "2.0"

# Git engine.
# We vendor libgit2 (so we don't depend on Fedora's possibly-stale system version),
# but link against the system OpenSSL via pkg-config (avoids needing Perl's
# FindBin / IPC::Cmd modules at build time, which are split out on modern Fedora).
# Requires `openssl-devel` to be installed system-wide.
git2 = { version = "0.19", default-features = false, features = ["https", "vendored-libgit2"] }

# Async runtime + http for OAuth
tokio = { version = "1.41", features = ["rt-multi-thread", "macros", "net", "io-util", "sync", "time"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# OS keyring - declared per-target below to pick the right backend.
# `linux-native` (keyutils) is in-memory only and does NOT survive reboots,
# which is why we previously lost tokens on every restart. The combined
# `linux-native-sync-persistent` backend uses keyutils as an in-process
# cache AND syncs to the D-Bus Secret Service (KWallet / GNOME Keyring)
# for actual persistence.

# OAuth helpers
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
url = "2.5"

# Utilities
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock"] }
dirs = "5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "sync-secret-service", "crypto-rust"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[features]
# This feature is used for production builds or when a dev server is not specified.
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
